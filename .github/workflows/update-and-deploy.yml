name: Update and deploy preseason standings

on:
  push:
    branches: [main]
  schedule:
    # 4:30 a.m. Mountain Daylight Time during the September preseason.
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nicehl-preseason-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test scoring calculations
        run: npm test

      - name: Fetch completed NHL preseason games
        run: npm run update

      - name: Validate standings output
        run: npm run validate-data

      - name: Save refreshed standings
        run: |
          git add data/current.json
          if git diff --cached --quiet; then
            echo "No standings changes to save."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update preseason standings"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
